<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Air Quality Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('/static/asign.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 40px 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      font-weight: 600;
      text-align: center;
      color: #00d1ff;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    input[type="text"],
    input[type="password"] {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    button {
      padding: 12px;
      border: none;
      background-color: #00bfff;
      color: white;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #009cd8;
    }

    .error-message {
      background-color: #ff4d4d;
      padding: 10px;
      color: #fff;
      font-size: 0.95rem;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: center;
      display: {% if error %} block {% else %} none {% endif %};
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 0.95rem;
    }

    .links a {
      color: #00ff90;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: #00cc72;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Login</h1>

    <!-- Error Message -->
    <p class="error-message">{{ error }}</p>

    <form action="/login" method="POST">
      <input type="text" name="username" placeholder="Enter your username" required />
      <input type="password" name="password" placeholder="Enter your password" required />
      <button type="submit">Log In</button>
    </form>

    <!-- Navigation Link -->
    <div class="links">
      Don’t have an account? <a href="/signup">Sign Up</a>
    </div>
  </div>
</body>
</html>
