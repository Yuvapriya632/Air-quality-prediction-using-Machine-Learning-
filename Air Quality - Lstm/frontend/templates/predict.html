<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Quality Prediction</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('/static/ain.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .navbar {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .navbar h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 500;
      color: #f6f8f8;
    }

    .navbar a {
      text-decoration: none;
      color: #fff;
      background-color: #ff4d4d;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.3s ease;
    }

    .navbar a:hover {
      background-color: #cc0000;
    }

    .container {
      margin-top: 160px;
      background-color: rgba(0, 0, 0, 0.75);
      padding: 40px 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 25px;
      color: #ffffff;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    input[type="text"],
    input[type="number"],
    select {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      color: #333;
    }

    button {
      padding: 12px;
      border: none;
      background-color: #00bfff;
      color: white;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #009cd8;
    }

    @media (max-width: 600px) {
      .container {
        width: 90%;
        padding: 30px 20px;
      }

      .navbar h2 {
        font-size: 1.2rem;
      }

      .navbar a {
        padding: 8px 14px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h2>Air Quality Prediction Dashboard</h2>
    <a href="/logout">Logout</a>
  </div>

  <div class="container">
    <h1>Enter Air Quality Parameters</h1>
    <form method="POST">
      <input type="text" name="SOi" placeholder="Sulphur Dioxide (SOi)" required />
      <input type="text" name="Noi" placeholder="Nitrogen Oxide (Noi)" required />
      <input type="text" name="Rpi" placeholder="Respirable Particulate Matter (Rpi)" required />
      <input type="text" name="SPMi" placeholder="Suspended Particulate Matter (SPMi)" required />
      <button type="submit">Predict AQI</button>
    </form>
  </div>

</body>
</html>
